<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeAlpha Calculator</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #a97a48; /* Dark sleek background */
        }

        .calculator-container {
            background-color: #66caeb;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            width: 340px;
        }

        .display {
            margin-bottom: 20px;
        }

        #screen {
            width: 100%;
            height: 70px;
            background-color: #0f172a;
            border: none;
            outline: none;
            border-radius: 10px;
            color: #f8fafc;
            font-size: 2rem;
            text-align: right;
            padding: 15px;
            box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.3);
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        .btn {
            height: 60px;
            border: none;
            outline: none;
            border-radius: 12px;
            background-color: #334155;
            color: #f8fafc;
            font-size: 1.4rem;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.1s ease;
        }

        .btn:hover {
            background-color: #475569;
        }

        .btn:active {
            transform: scale(0.95);
        }

        /* Operator and special button styles */
        .operator {
            background-color: #f97316; /* Orange color for symbols */
            color: white;
        }

        .operator:hover {
            background-color: #ea580c;
        }

        .clear {
            background-color: #ef4444;
        }

        .clear:hover {
            background-color: #dc2626;
        }

        .delete {
            background-color: #64748b;
        }

        .delete:hover {
            background-color: #475569;
        }

        .equals {
            background-color: #10b981;
            grid-row: span 2;
            height: 132px;
        }

        .equals:hover {
            background-color: #059669;
        }

        .zero {
            grid-column: span 2;
        }
    </style>
</head>
<body>

    <div class="calculator-container">
        <div class="display">
            <input type="text" id="screen" placeholder="0" readonly>
        </div>

        <div class="buttons">
            <button class="btn clear" onclick="clearScreen()">C</button>
            <button class="btn delete" onclick="deleteLast()">DEL</button>
            <button class="btn operator" onclick="appendValue('/')">÷</button>
            <button class="btn operator" onclick="appendValue('*')">×</button>

            <button class="btn" onclick="appendValue('7')">7</button>
            <button class="btn" onclick="appendValue('8')">8</button>
            <button class="btn" onclick="appendValue('9')">9</button>
            <button class="btn operator" onclick="appendValue('-')">−</button>

            <button class="btn" onclick="appendValue('4')">4</button>
            <button class="btn" onclick="appendValue('5')">5</button>
            <button class="btn" onclick="appendValue('6')">6</button>
            <button class="btn operator" onclick="appendValue('+')">+</button>

            <button class="btn" onclick="appendValue('1')">1</button>
            <button class="btn" onclick="appendValue('2')">2</button>
            <button class="btn" onclick="appendValue('3')">3</button>
            <button class="btn equals" onclick="calculateResult()">=</button>

            <button class="btn zero" onclick="appendValue('0')">0</button>
            <button class="btn" onclick="appendValue('.')">.</button>
        </div>
    </div>

    <script>
        const screen = document.getElementById('screen');

        // Display par value add karne ke liye
        function appendValue(value) {
            if (screen.value === "0" || screen.value === "Error") {
                screen.value = value;
            } else {
                screen.value += value;
            }
        }

        // Screen clear karne ke liye
        function clearScreen() {
            screen.value = "";
        }

        // Ek number delete karne ke liye
        function deleteLast() {
            if (screen.value === "Error") {
                screen.value = "";
            } else {
                screen.value = screen.value.slice(0, -1);
            }
        }

        // Result calculate karne ke liye
        function calculateResult() {
            try {
                if (screen.value !== "") {
                    screen.value = eval(screen.value);
                }
            } catch (error) {
                screen.value = "Error";
            }
        }

        // Bonus: Keyboard support
        document.addEventListener('keydown', function(event) {
            const key = event.key;

            if (!isNaN(key) || key === '.' || key === '+' || key === '-' || key === '*' || key === '/') {
                appendValue(key);
            } else if (key === 'Enter') {
                calculateResult();
            } else if (key === 'Backspace') {
                deleteLast();
            } else if (key === 'Escape') {
                clearScreen();
            }
        });
    </script>
</body>
</html>
